# Available variables:
#   %duration% - The duration left of the punishment if temporary
#   %time% - The time the ban will expire if temporary
#   %reason% - The reason for the punishment
#   %id% - The ID of the punishment
#   %name% - The name of the punished player
#   %uuid% - The UUID of the punished player
#   %operator% - The operator of the punishment
#   %plugin% - The name of the plugin
#   %version% - The version of the plugin

description:
  - "\u00A7b\u00A7l---------------------------------------------"
  - "\u00A71Running \u00A7bSanctionManager-%version% \u00A7eby vlouboos"
  - "\u00A73Type '/sm help' to view available commands."
  - "\u00A7b\u00A7l---------------------------------------------"

error:
  player-not-found: "\u00A7cPlayer not found. They may have never joined the server."

command:
  ban:
    usage: /ban <Player> [Duration] [Reason]
    desc: Ban a specific player.
    arg:
      player: The player to ban.
      duration: The duration of the ban, default permanent.
      reason: The reason for the ban.
  unban:
    usage: /unban <Player>
    desc: Unban a specific player.
    arg:
      player: The player to unban.
  mute:
    usage: /mute <Player> [Duration] [Reason]
    desc: Mute a specific player.
    arg:
      player: The player to mute.
      duration: The duration of the mute, default permanent.
      reason: The reason for the mute.
  unmute:
    usage: /unmute <Player>
    desc: Unmute a specific player.
    arg:
      player: The player to unmute.
  warn:
    usage: /warn <Player> [Reason]
    desc: Warn a specific player.
    arg:
      player: The player to warn.
      reason: The reason for the warning.

ban:
  permanent:
    - "\u00A7cYou are permanently banned from the server!"
    - ""
    - "\u00A77Reason: \u00A7f%reason%"
    - "\u00A77Find out more: \u00A7bhttps://github.com/FloatingPointMC/SanctionManager"
    - ""
    - "\u00A77Ban ID: \u00A7f#%id%"
    - "\u00A77Sharing your Ban ID may affect the processing of your appeal!"
  temporary:
    - "\u00A7cYou are temporarily banned for \u00A7f%duration%\u00A7c from the server!"
    - ""
    - "\u00A77Reason: \u00A7f%reason%"
    - "\u00A77Find out more: \u00A7bhttps://github.com/FloatingPointMC/SanctionManager"
    - ""
    - "\u00A77Ban ID: \u00A7f%id%"
    - "\u00A77Sharing your Ban ID may affect the processing of your appeal!"
mute:
  permanent:
    - "\u00A7c-------------------------------------------------------------------"
    - "\u00A7cYou are permanently muted on the server."
    - ""
    - "\u00A77Find out more: \u00A7ehttps://github.com/FloatingPointMC/SanctionManager"
    - "\u00A77Mute ID: \u00A7f#%id%"
    - "\u00A7c-------------------------------------------------------------------"
  temporary:
    - "\u00A7c-------------------------------------------------------------------"
    - "\u00A7cYou are currently muted on the server."
    - "\u00A77Your mute will expire in \u00A7f%duration%"
    - ""
    - "\u00A77Find out more: \u00A7ehttps://github.com/FloatingPointMC/SanctionManager"
    - ""
    - "\u00A77Mute ID: \u00A7f#%id%"
    - "\u00A7c-------------------------------------------------------------------"
warn:
  message:
    - "\u00A7e-------------------------------------------------------------------"
    - "\u00A7eYou have received a warning from the server."
    - ""
    - "\u00A77Reason: \u00A7f%reason%"
    - "\u00A77Find out more: \u00A7ehttps://github.com/FloatingPointMC/SanctionManager"
    - ""
    - "\u00A77Warn ID: \u00A7f#%id%"
    - "\u00A7e-------------------------------------------------------------------"